name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'tejasach06/helper-scripts' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, vm101, podman]
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Package static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    if: github.repository == 'tejasach06/helper-scripts' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, Linux, X64, vm101, podman]
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
